<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二建机电 · 1.1 金属材料 知识卡</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:16px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#f5f6f8;color:#1a1a1a;max-width:640px;margin:0 auto}
  h1{font-size:20px;margin:4px 0 2px}
  .sub{font-size:13px;color:#666;margin:0 0 12px}
  .bar{display:flex;gap:8px;font-size:13px;color:#444;margin-bottom:12px}
  .bar span{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:6px 10px;flex:1;text-align:center}
  .bar b{font-size:16px;display:block;margin-top:2px}
  .card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);min-height:240px;display:flex;flex-direction:column}
  .tag{font-size:12px;color:#0b6bcb;background:#e8f2ff;border-radius:6px;padding:3px 8px;align-self:flex-start;margin-bottom:12px}
  .q{font-size:19px;line-height:1.6;font-weight:600}
  .a{margin-top:16px;padding-top:16px;border-top:1px dashed #dde1e6;font-size:17px;line-height:1.75;color:#0f4c81;white-space:pre-wrap}
  .src{margin-top:auto;padding-top:12px;font-size:12px;color:#8a8f98}
  .acts{display:flex;gap:10px;margin-top:14px}
  button{flex:1;min-height:48px;font-size:16px;border-radius:10px;border:1px solid #d8dde3;background:#fff;color:#222;font-weight:600}
  button:active{transform:scale(.98)}
  #flip{background:#0b6bcb;color:#fff;border-color:#0b6bcb;flex:2}
  #bad{color:#c0392b;border-color:#f0c4bd}
  #good{color:#1e7b4f;border-color:#bfe3ce}
  .modes{display:flex;gap:8px;margin-top:12px;font-size:13px}
  .modes button{min-height:36px;font-size:13px;font-weight:400;color:#555}
  .modes button.on{background:#e8f2ff;border-color:#0b6bcb;color:#0b6bcb;font-weight:600}
  footer{margin-top:18px;font-size:12px;color:#8a8f98;line-height:1.7}
</style>
</head>
<body>
<h1>1.1 金属材料</h1>
<p class="sub">2027 版教材 P1–4（1.1.1）· 共 <span id="total">0</span> 张</p>

<div class="bar">
  <span>新卡<b id="nNew">0</b></span>
  <span>记住了<b id="nGood">0</b></span>
  <span>没记住<b id="nBad">0</b></span>
</div>

<div class="card">
  <div class="tag" id="tag">—</div>
  <div class="q" id="q">加载中…</div>
  <div class="a" id="a" hidden></div>
  <div class="src" id="src"></div>
</div>

<div class="acts">
  <button id="bad">没记住</button>
  <button id="flip">翻面看答案</button>
  <button id="good">记住了</button>
</div>

<div class="modes">
  <button data-mode="all" class="on">全部顺序</button>
  <button data-mode="shuffle">随机</button>
  <button data-mode="review">只练没记住</button>
</div>

<footer>
  内容出处：2027 版《机电工程管理与实务》P1–4。<br>
  规则：先自己答，再翻面。答不出立刻点「没记住」，明天 7:30 会再发给你。
</footer>

<script>
const CARDS = [
  {id:1, g:"分类", q:"金属材料分为哪三类？", a:"黑色金属、有色金属、特种金属材料。", s:"P1"},
  {id:2, g:"分类", q:"黑色金属又称什么？按含碳量怎么分？", a:"又称钢铁材料。\n碳 ≤ 0.0218% 为纯铁；\n0.0218%～2.11% 为钢；\n> 2.11% 为铸铁。", s:"P1"},
  {id:3, g:"分类", q:"钢和铸铁的分界线含碳量是多少？", a:"2.11%。钢的含碳量一般在 2.11% 以下。", s:"P1–P2"},
  {id:4, g:"分类", q:"有色金属的定义是什么？", a:"除铁、铬、锰以外的所有金属及其合金。", s:"P1"},
  {id:5, g:"分类", q:"有色金属通常分为哪几类？", a:"轻金属、重金属、贵金属、半金属、稀有金属、稀土金属。", s:"P1"},
  {id:6, g:"分类", q:"与纯金属相比，有色合金的性能有什么特点？", a:"强度和硬度一般更高；\n电阻大、电阻温度系数小。", s:"P1"},
  {id:7, g:"分类", q:"特种金属材料包括哪些？", a:"非晶态、准晶、微晶、纳米晶金属材料；\n隐身、抗氢、超导、形状记忆、耐磨、减振阻尼等功能合金；\n金属基复合材料。", s:"P1"},

  {id:8, g:"性能", q:"金属材料的性能分为哪两类？", a:"工艺性能和使用性能。", s:"P1"},
  {id:9, g:"性能", q:"工艺性能包括哪些？", a:"铸造性能、可焊性、可锻性、热处理性能、切削加工性能。", s:"P1"},
  {id:10, g:"性能", q:"使用性能包括哪三类？", a:"机械性能、物理性能、化学性能。", s:"P1"},
  {id:11, g:"性能", q:"机械性能（力学性能）的常用指标有哪些？", a:"强度、塑性、硬度、冲击韧性、多次冲击抗力、疲劳极限。", s:"P1"},
  {id:12, g:"性能", q:"物理性能主要包括什么？", a:"密度、熔点、热膨胀性、磁性、电学性能。", s:"P1"},
  {id:13, g:"性能", q:"化学性能主要看哪两项？", a:"耐腐蚀性、抗氧化性（又称氧化抗力）。", s:"P1"},

  {id:14, g:"钢", q:"钢按化学成分分为哪三类？", a:"非合金钢、低合金钢、合金钢。", s:"P2"},
  {id:15, g:"钢", q:"非合金钢按含碳量怎么分类？", a:"低碳钢 Wc < 0.25%；\n中碳钢 0.25% ≤ Wc ≤ 0.60%；\n高碳钢 Wc > 0.60%。", s:"P2"},
  {id:16, g:"钢", q:"碳素结构钢和碳素工具钢的用途区别？", a:"结构钢：机械零件和工程结构件，一般属低、中碳钢；\n工具钢：刀具、量具、模具，一般属高碳钢。", s:"P2"},
  {id:17, g:"钢", q:"非合金钢按质量等级分几类？硫磷限量各是多少？", a:"三类：\n普通质量 Ws ≤ 0.045%、Wp ≤ 0.045%；\n优质：硫磷比普通质量少，需特别控制质量；\n特殊质量 Ws ≤ 0.02%、Wp ≤ 0.025%。", s:"P2"},
  {id:18, g:"钢", q:"碳素结构钢的牌号由哪几部分组成？", a:"屈服强度字母 Q + 屈服强度数值（MPa）+ 质量等级符号（A、B、C、D，质量依次提高）+ 脱氧方法（F 沸腾钢、Z 镇静钢、TZ 特殊镇静钢）。", s:"P2"},
  {id:19, g:"钢", q:"Q235AF 每个字符什么意思？", a:"碳素结构钢；屈服强度 ≥ 235MPa；质量等级 A 级；脱氧方法为沸腾钢。", s:"P2–P3"},
  {id:20, g:"钢", q:"Q235 常用在什么地方？", a:"强度稍高，可做螺栓、螺母、销子、吊钩和不太重要的机械零件；\n建筑结构中的螺纹钢、型钢、钢筋等；\n质量较好的 Q235C、D 级可作重要焊接结构用材。", s:"P3"},
  {id:21, g:"钢", q:"优质碳素结构钢的牌号数字代表什么？", a:"平均含碳量的万分数。\n如 45 钢表示 Wc = 0.45%；08 钢表示 Wc = 0.08%。", s:"P3"},
  {id:22, g:"钢", q:"20 钢的特点和典型用途？", a:"冷塑性变形和焊接性好；\n用于强度要求不高的零件及渗碳零件：机罩、焊接容器、小轴、螺母、垫圈、渗碳齿轮。", s:"P3"},
  {id:23, g:"钢", q:"45 钢为什么用来做齿轮、连杆、轴？", a:"经调质后可获得良好的综合力学性能，属中碳钢，用于受力较大的机械零件。", s:"P3"},
  {id:24, g:"钢", q:"不锈钢的含铬量门槛是多少？", a:"含铬量 Wcr > 12%，才具有不锈钢的特点。", s:"P3"},
  {id:25, g:"钢", q:"不锈钢按热处理后的显微组织分为哪五类？", a:"铁素体不锈钢、马氏体不锈钢、奥氏体不锈钢、奥氏体-铁素体不锈钢、沉淀硬化不锈钢。", s:"P3"},
  {id:26, g:"钢", q:"锅炉钢的含碳量范围？高压锅炉用什么钢？", a:"含碳量 Wc 在 0.16%～0.26%；\n高压锅炉采用珠光体耐热钢或奥氏体耐热钢。", s:"P3"},
  {id:27, g:"钢", q:"耐热钢分为哪两类？", a:"抗氧化钢（高温不起皮，化学稳定性好但承载较低）；\n热强钢（高温强度高，并有相应抗氧化性）。", s:"P4"},

  {id:28, g:"有色", q:"纯铜的密度、熔点、外观和主要性能？", a:"玫瑰红色，表面氧化呈紫红色（故称紫铜）；\n密度 8.89 g/cm³，熔点 1083℃；\n导电性、导热性好，可进行各种冷、热加工。", s:"P4"},
  {id:29, g:"有色", q:"黄铜是什么合金？主要用途？", a:"铜和锌组成的合金，耐磨性能较强。\n无缝管：换热器、冷凝器、低温管路、海底管道；\n板材、条材、棒材、管材及铸造零件；\n铸件常做阀门和管道配件。", s:"P4"},
  {id:30, g:"有色", q:"白铜以什么为主要添加元素？分哪两类？", a:"以镍为主要添加元素。\n结构白铜：机械性能和耐蚀性好，色泽美观；\n电工白铜：热电性能好（锰铜、康铜、考铜）。", s:"P4"},
  {id:31, g:"有色", q:"青铜以什么为主要添加元素？四种青铜各用在什么地方？", a:"以锡为主要添加元素。\n锡青铜：轴承、蜗轮、齿轮；\n铅青铜：发动机和磨床轴承；\n铝青铜：高载荷齿轮、轴套、船用螺旋桨；\n铍青铜：精密弹簧、电接触元件。", s:"P4"},
  {id:32, g:"有色", q:"铝的密度、熔点和性能特点？", a:"银白色轻金属，密度 2.698 g/cm³，熔点 660.24℃；\n化学性能活泼，塑性好、强度低，适合冷加工成型（轧制、挤压、模锻、冷冲、弯曲）。", s:"P4"}
];

const KEY = "erjian_mec_1_1_status";
let status = JSON.parse(localStorage.getItem(KEY) || "{}");
let mode = "all";
let queue = [];
let pos = 0;

const el = id => document.getElementById(id);

function buildQueue() {
  let ids = CARDS.map(c => c.id);
  if (mode === "review") ids = ids.filter(id => status[id] === 0);
  if (mode === "shuffle") ids.sort(() => Math.random() - 0.5);
  queue = ids;
  pos = 0;
}

function render() {
  el("total").textContent = CARDS.length;
  const good = CARDS.filter(c => status[c.id] === 1).length;
  const bad = CARDS.filter(c => status[c.id] === 0).length;
  el("nNew").textContent = CARDS.length - good - bad;
  el("nGood").textContent = good;
  el("nBad").textContent = bad;

  if (!queue.length) {
    el("tag").textContent = "完成";
    el("q").textContent = mode === "review" ? "没有待复习的卡了，换「全部顺序」再来一遍。" : "这一轮走完了，换「只练没记住」巩固。";
    el("a").hidden = true;
    el("src").textContent = "";
    return;
  }
  if (pos >= queue.length) pos = 0;
  const c = CARDS.find(x => x.id === queue[pos]);
  el("tag").textContent = c.g;
  el("q").textContent = c.q;
  el("a").textContent = c.a;
  el("a").hidden = true;
  el("src").textContent = "出处：" + c.s + "　（第 " + (pos + 1) + " / " + queue.length + " 张）";
  el("flip").textContent = "翻面看答案";
}

el("flip").onclick = () => {
  const a = el("a");
  a.hidden = !a.hidden;
  el("flip").textContent = a.hidden ? "翻面看答案" : "收起答案";
};

function mark(v) {
  if (!queue.length) return;
  status[queue[pos]] = v;
  localStorage.setItem(KEY, JSON.stringify(status));
  pos = (pos + 1) % queue.length;
  render();
}

el("good").onclick = () => mark(1);
el("bad").onclick = () => mark(0);

document.querySelectorAll(".modes button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".modes button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    mode = b.dataset.mode;
    buildQueue();
    render();
  };
});

buildQueue();
render();
</script>
</body>
</html>
